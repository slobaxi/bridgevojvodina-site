name: Deploy to DirectAdmin

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Deploy to DirectAdmin
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, mysql, gd, zip
        
    - name: Install Composer Dependencies
      run: |
        cd bridgevojvodina-laravel
        composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: bridgevojvodina-laravel/package-lock.json
        
    - name: Install NPM Dependencies and Build
      run: |
        cd bridgevojvodina-laravel
        npm ci
        npm run build
        
    - name: Create Deployment Archive
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: |
        cd bridgevojvodina-laravel
        # Clean token (remove any trailing newlines/spaces)
        CLEAN_TOKEN=$(echo -n "$DEPLOY_TOKEN" | tr -d '\r\n ' )
        
        # Rename public to public_html for DirectAdmin compatibility
        mv public public_html
        
        # Create ZIP excluding the extract script (we'll upload it separately)
        zip -r ../deploy.zip . -x "node_modules/*" "tests/*" ".git/*" ".env*" "storage/logs/*" "storage/framework/cache/*" "storage/framework/sessions/*" "storage/framework/views/*" "package.json" "package-lock.json" "phpunit.xml" "tailwind.config.js" "vite.config.js" "postcss.config.js" "README.md" ".editorconfig" ".gitattributes" "public_html/extract.php"
        cd ..
        
        mkdir -p deploy_ready/public_html
        mv deploy.zip deploy_ready/
        
        # Prepare the extract script with robust token injection
        # We put it in both the root and public_html to handle different FTP_SERVER_DIR settings
        cp bridgevojvodina-laravel/public_html/extract.php deploy_ready/extract.php
        CLEAN_TOKEN=$CLEAN_TOKEN php -r '$t=getenv("CLEAN_TOKEN"); $c=file_get_contents("deploy_ready/extract.php"); file_put_contents("deploy_ready/extract.php", str_replace(chr(39)."DEPLOY_TOKEN_PLACEHOLDER".chr(39), var_export($t, true), $c));'
        cp deploy_ready/extract.php deploy_ready/public_html/extract.php
        
    - name: Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ secrets.FTP_SERVER_DIR }}
        local-dir: ./deploy_ready/
        state-name: .ftp-deploy-zip-state.json
        
    - name: Trigger Extraction
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: |
        CLEAN_TOKEN=$(echo -n "$DEPLOY_TOKEN" | tr -d '\r\n ' )
        USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        
        # Allow some time for the server to recognize the newly uploaded files
        sleep 5

        # Try both common locations with POST and browser headers
        # Use -d instead of --get to make it a POST request, which often bypasses GET filters
        curl -L -f -v -H "User-Agent: $USER_AGENT" -H "Content-Type: application/x-www-form-urlencoded" -d "token=$CLEAN_TOKEN" "https://bridgevojvodina.rs/extract.php" || \
        curl -L -f -v -H "User-Agent: $USER_AGENT" -H "Content-Type: application/x-www-form-urlencoded" -d "token=$CLEAN_TOKEN" "https://bridgevojvodina.rs/public_html/extract.php"
